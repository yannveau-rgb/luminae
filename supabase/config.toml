# Configuration locale Supabase CLI.
# En production, le projet est créé sur le dashboard (région UE exigée :
# eu-west-3 Paris ou eu-central-1 Francfort) puis les migrations sont
# appliquées avec :  npx supabase db push  (aucune action manuelle dans l'UI).
project_id = "dyhuirypqokaqzuzgbal"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "20MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "**"]
jwt_expiry = 3600
enable_signup = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false

[analytics]
enabled = false
